name: VM6 Readonly GitHub Token Mergify Mutation Matrix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Probe Mergify mutation authorization with read-only GITHUB_TOKEN
        env:
          GH_TOKEN_FOR_MERGIFY: ${{ github.token }}
          OWNER: ivastic-vm6-secondary-20260911
          REPO: vm6-delete-reverse-20260914
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.mergify.com/v1'
          auth=(-H "Authorization: Bearer ${GH_TOKEN_FOR_MERGIFY}" -H 'Content-Type: application/json')
          probe() {
            local label=$1 method=$2 url=$3 data=${4-}
            local out status
            out=$(mktemp)
            if [ -n "$data" ]; then
              status=$(curl -sS -o "$out" -w '%{http_code}' -X "$method" "${auth[@]}" --data "$data" "$url")
            else
              status=$(curl -sS -o "$out" -w '%{http_code}' -X "$method" "${auth[@]}" "$url")
            fi
            echo "VM6_MATRIX ${label} status=${status}"
            jq -c '{detail,message,id,reason,paused,queue_pause,scheduled_freezes}' "$out" 2>/dev/null || head -c 600 "$out" || true
            echo
          }
          base="$api/repos/$OWNER/$REPO"
          probe mq_pause PUT "$base/merge-queue/pause" '{"reason":"VM6 readonly GITHUB_TOKEN matrix"}'
          probe legacy_pause PUT "$base/queue/pause" '{"reason":"VM6 readonly GITHUB_TOKEN matrix"}'
          freeze='{"reason":"VM6 readonly GITHUB_TOKEN matrix","start":"2099-01-01T00:00:00","end":"2099-01-02T00:00:00","timezone":"UTC","matching_conditions":[],"exclude_conditions":[]}'
          probe scheduled_freeze POST "$base/scheduled_freeze" "$freeze"
          cfg=$(jq -Rs '{mergify_yml:.}' .mergify.yml)
          probe repo_simulator POST "$base/simulator" "$cfg"
