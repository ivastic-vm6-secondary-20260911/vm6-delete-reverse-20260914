name: VM6 Copy Workflow Secret Canary 20260917
on:
  push:
    branches:
      - 'mergify/copy/**'
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Verify repository secret trust promotion
        shell: bash
        env:
          CANARY: ${{ secrets.VM6_COPY_WORKFLOW_CANARY }}
        run: |
          if [ "$CANARY" = 'VM6_COPY_WORKFLOW_CANARY_20260917_P3R7' ]; then
            echo 'VM6_COPY_WORKFLOW_SECRET_PRESENT_P3R7'
          else
            echo 'VM6_COPY_WORKFLOW_SECRET_ABSENT_P3R7'
            exit 1
          fi
