name: VM6 MQ Retry Original Head Freshness

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  vm6-headfresh-gate:
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    steps:
      - name: Fail first synthetic generation, pass later generation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          flag='vm6-headfresh-retry-flag-20260916'
          echo "PR=${{ github.event.pull_request.number }} head=${{ github.event.pull_request.head.sha }} base=${{ github.event.pull_request.base.ref }}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${flag}" >/dev/null 2>&1; then
            echo 'VM6_HEADFRESH_RETRY_PASS'
            exit 0
          fi
          echo 'VM6_HEADFRESH_FIRST_GENERATION'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${flag}" \
            -f sha="${GITHUB_SHA}"
          echo 'VM6_HEADFRESH_FLAG_CREATED; sleeping before deterministic failure'
          sleep 60
          echo 'VM6_HEADFRESH_FIRST_GENERATION_FAIL'
          exit 1
