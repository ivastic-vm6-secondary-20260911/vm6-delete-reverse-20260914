name: VM6 Issue Comment Provenance 20260917
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: read
jobs:
  source:
    name: vm6-issue-comment-source
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, 'VM6_ISSUE_COMMENT_PROVENANCE_Q7R4_RUN2')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout external PR head without secrets
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
      - name: Convert PR-head data into inert artifact
        shell: bash
        run: |
          echo "EVENT_NAME=${GITHUB_EVENT_NAME}"
          echo "ACTOR=${GITHUB_ACTOR}"
          echo "WORKFLOW_SHA=${GITHUB_SHA}"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          cat vm6-issue-comment-provenance.txt
          cp vm6-issue-comment-provenance.txt /tmp/vm6-pr-data.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vm6-pr-data
          path: /tmp/vm6-pr-data.txt

  report:
    name: vm6-issue-comment-report
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: vm6-pr-data
          path: artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install released Mergify pytest client
        run: pip install --disable-pip-version-check -q 'pytest==9.1.1' 'pytest-mergify==2026.9.11.2'
      - name: Generate trusted local test from PR-head data only
        shell: bash
        run: |
          cat > test_vm6_issue_comment_health.py <<'PY'
          from pathlib import Path
          def test_vm6_issue_comment_pr_data_20260917_q7r4():
              data = Path('artifact/vm6-pr-data.txt').read_text().strip()
              assert data == 'PASS', f'controlled PR-head data was {data!r}'
          PY
      - name: Upload Test Insights result
        env:
          MERGIFY_TOKEN: ${{ secrets.VM6_ISSUE_COMMENT_MERGIFY_TOKEN }}
          PYTEST_MERGIFY_ENABLE: '1'
        run: pytest -q -s test_vm6_issue_comment_health.py
