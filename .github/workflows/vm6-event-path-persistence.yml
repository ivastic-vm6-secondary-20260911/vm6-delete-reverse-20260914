name: VM6 GITHUB_EVENT_PATH persistence probe
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - vm6-event-path-trigger.txt
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: mutate event payload in step one
        shell: bash
        run: |
          set -euo pipefail
          echo "STEP1_PATH=$GITHUB_EVENT_PATH"
          stat -c 'STEP1_STAT=%d:%i:%a:%U:%G:%s' "$GITHUB_EVENT_PATH"
          python3 - <<'PY'
          import json, os
          p=os.environ['GITHUB_EVENT_PATH']
          with open(p) as f: data=json.load(f)
          data['vm6_mutated_by_previous_step']=True
          data.setdefault('pull_request',{}).setdefault('base',{})['ref']='VM6_SPOOFED_BASE_CANARY'
          with open(p,'w') as f: json.dump(data,f)
          print('STEP1_MUTATION_WRITTEN=true')
          PY
          grep -o 'vm6_mutated_by_previous_step[^,}]*' "$GITHUB_EVENT_PATH" || true
      - name: observe event payload in step two
        shell: bash
        run: |
          set -euo pipefail
          echo "STEP2_PATH=$GITHUB_EVENT_PATH"
          stat -c 'STEP2_STAT=%d:%i:%a:%U:%G:%s' "$GITHUB_EVENT_PATH"
          python3 - <<'PY'
          import json, os
          p=os.environ['GITHUB_EVENT_PATH']
          with open(p) as f: data=json.load(f)
          print('STEP2_MUTATED='+str(data.get('vm6_mutated_by_previous_step')))
          print('STEP2_BASE='+str(data.get('pull_request',{}).get('base',{}).get('ref')))
          PY
